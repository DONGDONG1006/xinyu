# 甘肃新煜科技工作台 · Nginx 反代（域名 + HTTPS）
# 作用：把 https://workbench.你的域名.com 反代到本机 127.0.0.1:8090
# 关键点：SSE 长连接必须关闭代理缓冲；并放大读取超时。
#
# 部署步骤：
#   1. 把本文件放到 /etc/nginx/sites-available/xinyu-workbench 并 ln -s 到 sites-enabled
#   2. sudo certbot --nginx -d workbench.你的域名.com   # 自动签发并改写 443 段
#   3. sudo nginx -t && sudo systemctl reload nginx

# HTTP（Certbot 会自动补充 443 跳转与证书）
server {
    listen 80;
    server_name workbench.你的域名.com;
    location / { return 301 https://$host$request_uri; }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name workbench.你的域名.com;

    # ssl_certificate /etc/letsencrypt/live/workbench.你的域名.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/workbench.你的域名.com/privkey.pem;
    # （以上两行由 certbot --nginx 自动写入）

    # 安全相关（可选）
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接关键配置
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
